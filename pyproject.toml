[project]
name = "dom6-assistant"
version = "0.1.0"
description = "AI assistant that hooks into Dominions 6 to read game state and make decisions"
requires-python = ">=3.11"
dependencies = [
    "construct>=2.10",      # declarative binary format parsing
    "psutil>=6.0",          # cross-platform process discovery
    "rich>=13.0",           # pretty terminal output / debug views
    "click>=8.0",           # CLI entry point
    "tomli>=2.0; python_version < '3.11'",  # config file parsing (built-in 3.11+)
    # Model backends — all optional so the core works without API keys
    "anthropic>=0.40; extra == 'anthropic'",
    "openai>=1.50; extra == 'openai'",
    "google-generativeai>=0.8; extra == 'gemini'",
    "ollama>=0.4; extra == 'ollama'",
    "frida-tools>=14.8.1",
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai    = ["openai>=1.50"]
gemini    = ["google-generativeai>=0.8"]
ollama    = ["ollama>=0.4"]
# Reading Illwinter's manual locally. Pure Python, so it works on Windows
# without poppler, which is where most Dominions players are.
manual    = ["pypdf>=5.0"]
# Strategy-video transcripts. Only needed to *fetch* them; searching an
# index you already built needs nothing extra.
videos    = ["yt-dlp>=2025.1"]
web = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.1",
    "tomli-w>=1.0",
]
all-backends = [
    "anthropic>=0.40",
    "openai>=1.50",
    "google-generativeai>=0.8",
    "ollama>=0.4",
]
all = [
    "anthropic>=0.40",
    "openai>=1.50",
    "google-generativeai>=0.8",
    "ollama>=0.4",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.1",
    "tomli-w>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "mypy>=1.10",
    "ruff>=0.4",
]

[project.scripts]
dom6-assistant = "dom6_assistant.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dom6_assistant"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
