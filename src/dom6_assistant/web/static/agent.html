function userMessage(exchange){
  return history.find(message =>
    message.role === 'user' && message._exchange === exchange);
}

function prepareRetry(exchange){
  const index = history.findIndex(message =>
    message.role === 'user' && message._exchange === exchange);
  if(index < 0) return null;
  const hasLaterPrompt = history.slice(index + 1).some(message =>
    message.role === 'user');
  if(hasLaterPrompt &&
      !confirm('Retrying this earlier prompt will discard every later message. Continue?')){
    return null;
  }
  const text = history[index].content;
  history = history.slice(0, index + 1);
  const kept = new Set(history.map(message => message._exchange));
  transcript = transcript.filter(entry =>
    kept.has(entry._exchange) &&
    (entry._exchange !== exchange || entry.kind === 'user'));
  saveChat(); renderTranscript();
  return text;
}

function retryExchange(exchange){
  const text = prepareRetry(exchange);
  if(text != null) submitPrompt(text, exchange, true);
}

// ── inline message editing ─────────────────────────────────────────────────
// The message itself becomes the editor. A modal prompt() could not be resized
// or scrolled, showed no surrounding conversation, and lost the text outright
// if it was dismissed by accident.
function editInline(bubbleElement, current, label, onSave){
  if(!bubbleElement || bubbleElement.dataset.editing === 'true') return;
  bubbleElement.dataset.editing = 'true';
  const body = bubbleElement.querySelector('.body');
  const actions = bubbleElement.querySelector('.msg-actions');
  const editor = document.createElement('textarea');
  editor.className = 'msg-editor';
  editor.value = current;                  // the source text, not the rendering
  const bar = document.createElement('div');
  bar.className = 'msg-editor-bar';
  bar.innerHTML = '<button type="button" data-do="save">' + esc(label) + '</button>' +
    '<button type="button" class="ghost" data-do="cancel">Cancel</button>' +
    '<span class="hint">Ctrl+Enter saves · Esc cancels</span>';
  if(body) body.style.display = 'none';
  if(actions) actions.style.display = 'none';
  bubbleElement.appendChild(editor);
  bubbleElement.appendChild(bar);

  const close = () => {
    editor.remove(); bar.remove();
    if(body) body.style.display = '';
    if(actions) actions.style.display = '';
    delete bubbleElement.dataset.editing;
  };
  const commit = () => {
    const value = editor.value.trim();
    if(!value){ close(); return; }          // emptying is a cancel, not a delete
    close();
    onSave(value);
  };
  bar.querySelector('[data-do="save"]').onclick = commit;
  bar.querySelector('[data-do="cancel"]').onclick = close;
  editor.onkeydown = event => {
    if(event.key === 'Escape'){ event.preventDefault(); close(); }
    else if(event.key === 'Enter' && (event.ctrlKey || event.metaKey)){
      event.preventDefault(); commit();
    }
  };
  editor.style.height = 'auto';
  editor.style.height = Math.min(Math.max(editor.scrollHeight, 70), 400) + 'px';
  editor.focus();
  editor.setSelectionRange(editor.value.length, editor.value.length);
}

function bubbleFor(exchange, kind){
  return [...log.querySelectorAll('.msg.' + kind)].find(
    element => element.dataset.exchange === exchange) || null;
}

function editAndRetry(exchange, bubbleElement){
  const message = userMessage(exchange); if(!message) return;
  editInline(bubbleElement || bubbleFor(exchange, 'user'), message.content,
             'Save & retry', changed => {
    const text = prepareRetry(exchange); if(text == null) return;
    message.content = changed;
    const visible = transcript.find(entry =>
      entry.kind === 'user' && entry._exchange === exchange);
    if(visible) visible.text = message.content;
    saveChat(); renderTranscript();
    submitPrompt(message.content, exchange, true);
  });
}

function deleteExchange(exchange){
  if(!confirm('Delete this prompt, its response, and its tool activity?')) return;
  history = history.filter(message => message._exchange !== exchange);
  transcript = transcript.filter(entry => entry._exchange !== exchange);
  saveChat(); renderTranscript();
}

function deleteResponse(exchange){
  history = history.filter(message =>
    !(message.role === 'assistant' && message._exchange === exchange));
  transcript = transcript.filter(entry =>
    entry._exchange !== exchange || entry.kind === 'user');
  saveChat(); renderTranscript();
}

function editResponse(exchange, bubbleElement){
  const message = history.find(item =>
    item.role === 'assistant' && item._exchange === exchange);
  const visible = transcript.find(entry =>
    entry.kind === 'bot' && entry._exchange === exchange);
  if(!message || !visible) return;
  editInline(bubbleElement || bubbleFor(exchange, 'bot'), visible.text,
             'Save', changed => {
    visible.text = changed;
    const marker = '\n\nFinal answer:\n';
    const markerAt = message.content.lastIndexOf(marker);
    message.content = markerAt >= 0
      ? message.content.slice(0, markerAt + marker.length) + visible.text
      : visible.text;
    saveChat(); renderTranscript();
  });
}

retryLast.onclick = () => {
  const exchange = latestUserExchange();
  if(exchange) retryExchange(exchange);
};

stopRun.onclick = () => {
  if(!busy || !currentRun) return;
  const active=currentRun;
  active.userCancelled=true;
  stopRun.disabled=true; stopRun.textContent='Stopping…';
  // This request deliberately does not share the generation's AbortController:
  // it must reach the server while the response stream is being torn down.
  void apiFetch('/api/agent/cancel', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({run_id:active.id})}).catch(()=>{});
  active.controller.abort();
  if(!active.cancelShown){
    bubble('cancelled',
      'Assistant run stopped. No later tool calls from it will be executed.',
      true,active.exchange);
    active.cancelShown=true;
  }
  // Restore the exact request for the common stop/edit/send workflow. The
  // original attempt remains visibly marked as cancelled in history.
  input.value=active.prompt;
  input.dispatchEvent(new Event('input'));
  input.focus();
};

form.onsubmit = e => {
  e.preventDefault();
  const text = input.value.trim();
  if(!text || busy) return;
  submitPrompt(text);
};

async function submitPrompt(text, exchange=null, reuse=false){
  if(busy) return;
  exchange = exchange || newExchangeId();
  busy = true; send.disabled = true;
  const runId=(globalThis.crypto&&crypto.randomUUID)
    ? crypto.randomUUID()
    : Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
  const controller=new AbortController();
  currentRun={id:runId,controller,prompt:text,exchange,
              userCancelled:false,cancelShown:false};
  stopRun.style.display=''; stopRun.disabled=false; stopRun.textContent='Stop';
  updateChatControls();
  if(!reuse){
    bubble('user', text, true, exchange);
    history.push({role:'user', content:text, _exchange:exchange});
    saveChat();
  }
  input.value = ''; input.style.height = 'auto';

  let buf = '', pending = null, finalText = '', retained = false;
  // Bubbles being grown by streamed deltas, one per channel.
  const streaming = {think:null, bot:null};
  let continuationNotice = null;

  function clearContinuationNotice(){
    if(continuationNotice){ continuationNotice.remove(); continuationNotice = null; }
  }
  function showContinuationNotice(){
    clearContinuationNotice(); clearActivityEmpty();
    continuationNotice = document.createElement('div');
    continuationNotice.className = 'activity-note continuation';
    continuationNotice.textContent =
      'Tool result delivered to the assistant. Waiting for its next response…';
    activity.appendChild(continuationNotice);
    activity.scrollTop = activity.scrollHeight;
  }

  function retainRunForNextMessage(){
    if(retained) return;
    retained = true;
    // Tool calls/results remain in transcript Activity for inspection. Putting
    // them in an assistant-role history message makes the model treat harness
    // evidence as prose it previously authored and sometimes echo it.
    if(finalText){
      history.push({role:'assistant', content:finalText, _exchange:exchange});
      saveChat();
    }
  }

  function retireStreamedStep(){
    // A delta is provisional: until completion we do not know whether it is a
    // final answer or narration plus a text-protocol tool call. At any tool or
    // failure boundary discard provisional answer text. Parsed narration is
    // retained separately in chat by the authoritative `text` event.
    if(streaming.think){
      transcript.push({kind:'think', text:streaming.think.dataset.raw || '',
                       _exchange:exchange});
      streaming.think = null;
      saveChat();
    }
    if(streaming.bot){ streaming.bot.remove(); streaming.bot = null; }
  }

  function acceptBlock(part){
    const payload = part.split('\n').filter(line => line.startsWith('data:'))
      .map(line => line.slice(5).trimStart()).join('\n').trim();
    if(!payload || payload === '[DONE]') return;
    let ev;
    try{ ev = JSON.parse(payload); }
    catch(error){ bubble('err', 'Could not parse an assistant stream event: ' + payload, true, exchange); return; }
    if(ev.kind !== 'tool_result') clearContinuationNotice();

    if(ev.kind === 'delta' && ev.text){
      // A streamed fragment. It grows an already-open bubble rather than
      // making one per token; the matching `done` still carries the whole
      // text, so the saved transcript holds a message and not a pile of bits.
      const cls = ev.channel === 'reasoning' ? 'think' : 'bot';
      if(!streaming[cls]) streaming[cls] = bubble(cls, '', false, exchange);
      streaming[cls].dataset.raw = (streaming[cls].dataset.raw || '') + ev.text;
      const body = streaming[cls].querySelector('.body');
      if(cls === 'bot'){
        body.className = 'body md';
        body.innerHTML = renderMarkdown(streaming[cls].dataset.raw);
      }else{
        body.textContent = streaming[cls].dataset.raw;
      }
      log.scrollTop = log.scrollHeight;
    }
    else if(ev.kind === 'reasoning' && ev.text)  { bubble('think', ev.text, true, exchange); }
    else if(ev.kind === 'text' && ev.text)  {
      // `text` is narration emitted immediately before a tool call, not a
      // finished answer. Show it as explicitly labelled progress in chat so a
      // human can follow the assistant without opening the Activity drawer.
      bubble('progress', ev.text, true, exchange);
    }
    else if(ev.kind === 'tool_call')       {
      retireStreamedStep();
      pending = {
        card:toolCard(ev.tool, ev.args, true, exchange),
        name:ev.tool, args:ev.args,
      };
      showActivity();
    }
    else if(ev.kind === 'tool_result')     {
      retireStreamedStep();
      if(pending){
        fillTool(pending.card, ev.result);
        pending = null;
      }else{
        const card = toolCard(ev.tool || '(unpaired result)', {}, true, exchange);
        fillTool(card, ev.result);
      }
      showContinuationNotice();
    }
    else if(ev.kind === 'error')           {
      retireStreamedStep(); bubble('err', ev.text, true, exchange);
    }
    else if(ev.kind === 'cancelled')       {
      retireStreamedStep();
      if(currentRun) currentRun.cancelShown=true;
      bubble('cancelled',ev.text||'Assistant run stopped.',true,exchange);
    }
    else if(ev.kind === 'done' && ev.text){
      // Retire the streamed bubbles. The thinking is kept exactly as shown;
      // the answer is replaced by one rendered from the authoritative text.
      retireStreamedStep();
      bubble('bot', ev.text, true, exchange); finalText = ev.text;
    }
  }

  try{
    // Do not send the just-added user message twice: TurnAgent appends
    // `message` after it receives the prior conversation as `history`.
    const priorHistory = history.slice(0, -1)
      .map(cleanHistoryMessage).filter(Boolean).map(message => ({
        role:message.role, content:message.content,
      }));
    const endpoint = isOpenChat() ? '/api/agent/open/chat'
                   : isPretender() ? '/api/agent/pretender/chat'
                   : '/api/agent/chat';
    const request = {message:text, allow_writes:$('#w').checked,
                     stream:$('#stream').checked,
                     max_steps:Math.max(1,Math.min(500,parseInt(maxSteps.value,10)||24)),
                     history:priorHistory, run_id:runId};
    if(!isPretender() && !isOpenChat()) request.game=gameProfile.value;
    if(isPretender()){
      request.nation_id = Number(designNation.value);
      request.autonomous = $('#auto').checked;
    }
    const res = await apiFetch(endpoint, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(request), signal:controller.signal
    });

    if(!res.ok) throw new Error(res.status + ' ' + await res.text());
    if(!res.body) throw new Error('the browser did not provide a response stream');

    const reader = res.body.getReader(), dec = new TextDecoder();
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      // sse-starlette correctly uses CRLF by default. The old decoder looked
      // only for LF-LF, so a completed answer remained stranded in `buf`.
      buf = buf.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      const parts = buf.split('\n\n'); buf = parts.pop();
      parts.forEach(acceptBlock);
    }
    buf += dec.decode();
    buf = buf.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    if(buf.trim()) acceptBlock(buf);
    retainRunForNextMessage();
  }catch(error){
    if(error.name==='AbortError'){
      if(currentRun&&!currentRun.cancelShown){
        bubble('cancelled',
          'Assistant run stopped. No later tool calls from it will be executed.',
          true,exchange);
        currentRun.cancelShown=true;
      }
    }else{
      bubble('err', 'Request failed: ' + error.message, true, exchange);
    }
    retainRunForNextMessage();
  }finally{
    clearContinuationNotice();
    busy = false; send.disabled = false;
    currentRun = null;
    stopRun.style.display='none'; stopRun.disabled=false; stopRun.textContent='Stop';
    updateChatControls();
    loadState(); loadIngest();
    loaders[document.querySelector('nav button.sel').dataset.p]();
  }
}

$('#clear-chat').onclick = () => {
  if(busy) return;
  const meta = activeConversation();
  // Emptying a named chat keeps its name and its place in the list; Delete is
  // the control that removes it.
  if(!confirm(meta
      ? 'Clear every message in "' + meta.title + '"? The chat itself stays.'
      : 'Clear the saved assistant conversation in this browser?')) return;
  history = []; transcript = [];
  localStorage.removeItem(chatKey());
  log.innerHTML = '<div class="empty">Chat cleared. ' + esc(emptyLogMessage()) + '</div>';
  activity.innerHTML = '<div class="empty">Tool calls and their complete returned data will appear here.</div>';
  updateActivityCount();
  updateChatControls();
  if(meta) saveChat();
};

async function switchWorkspace(){
  if(busy) return;
  // Flush before the reset below: a queued write belongs to the workspace being
  // left, not the one being entered.
  await flushConversationSave();
  const generation = ++workspaceGeneration;
  designNation.style.display = isPretender() ? '' : 'none';
  gameProfile.style.display = (isPretender() || isOpenChat()) ? 'none' : '';
  $('#auto-control').style.display = isPretender() ? '' : 'none';
  // Nothing in open chat writes, so offering the permission would be a lie.
  $('#write-control').style.display = isOpenChat() ? 'none' : '';
  if(isOpenChat()) $('#w').checked = false;
  localStorage.setItem('dom6-agent-mode', mode.value);
  history = []; transcript = [];
  log.innerHTML = '<div class="empty">' + esc(emptyLogMessage()) + '</div>';
  activity.innerHTML = '<div class="empty">Tool calls and their complete returned data will appear here.</div>';
  updateActivityCount();
  updateChatControls();
  input.placeholder = isOpenChat()
    ? 'e.g. Compare EA Yomi and EA Ulm. Which suits a bless strategy?'
    : isPretender()
    ? 'e.g. Design and save a strong scales pretender for this nation.'
    : 'e.g. Assess our position. What should each commander do this turn?';
  if(isPretender()) document.querySelector('nav button[data-p="tools"]').click();
  restoreControls(); loadState(); loadOrders(); loadIngest();
  await openConversationLibrary(generation);
  if(generation!==workspaceGeneration) return;
  if(document.querySelector('nav button.sel').dataset.p==='character') loadCharacter();
  $('#w').onchange({target:$('#w')});
  $('#auto').onchange({target:$('#auto')});
}

async function initialiseWorkspaces(){
  const gameData = await fetch('/api/agent/games').then(r=>r.json());
  gameRecords = gameData.games||[];
  const requested=new URLSearchParams(location.search).get('game');
  const remembered=localStorage.getItem('dom6-agent-game');
  const live=(gameData.games||[]).filter(g=>g.live_available);
  const chosen=(gameData.games||[]).find(g=>g.profile===(requested||remembered)) || live[live.length-1] || (gameData.games||[])[0];
  gameProfile.innerHTML=(gameData.games||[]).map(g=>
    '<option value="'+esc(g.profile)+'" data-game-id="'+esc(g.game_id)+'"'+(chosen&&g.profile===chosen.profile?' selected':'')+
    (g.live_available?'':' disabled')+'>'+esc((g.nation||g.nation_slug||'?')+' · '+g.save_name+(g.live_available?'':' (live files unavailable)'))+'</option>'
  ).join('');
  if(chosen) localStorage.setItem('dom6-agent-game',chosen.profile);
  gameProfile.onchange=()=>{ localStorage.setItem('dom6-agent-game',gameProfile.value); switchWorkspace(); };
  const nations = await fetch('/api/agent/pretender/nations').then(r=>r.json());
  designNation.innerHTML = nations.map(n =>
    '<option value="' + n.id + '">' +
      esc(n.age + ' · ' + n.id + ' · ' + n.name +
          (n.epithet ? ' — ' + n.epithet : '')) + '</option>'
  ).join('');
  const rememberedNation = localStorage.getItem('dom6-agent-design-nation');
  if(rememberedNation && nations.some(n => String(n.id) === rememberedNation)){
    designNation.value = rememberedNation;
  }
  mode.value = localStorage.getItem('dom6-agent-mode') || 'turn';
  mode.onchange = switchWorkspace;
  designNation.onchange = () => {
    localStorage.setItem('dom6-agent-design-nation', designNation.value);
    switchWorkspace();
  };
  switchWorkspace();
}
initialiseWorkspaces();
</script>
